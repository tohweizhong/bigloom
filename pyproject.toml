[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bigloom"
version = "0.1.0"
description = "Large-file builder and target-leakage gate on top of WorldLoom for connector evaluations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
bigloom = "bigloom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bigloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
